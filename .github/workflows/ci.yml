name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - name: Check all Edge Functions
        run: |
          deno check supabase/functions/student-cedula-login/index.ts
          deno check supabase/functions/admin-pin-login/index.ts
          deno check supabase/functions/bootstrap-admin/index.ts
          deno check supabase/functions/bootstrap-admin-pin/index.ts
          deno check supabase/functions/sync-firebase-periods/index.ts
          deno check supabase/functions/external-similarity/index.ts
          deno check supabase/functions/citation-integrity/index.ts
          deno check supabase/functions/ai-writing-indicators/index.ts
